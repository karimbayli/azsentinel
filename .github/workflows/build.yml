name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CENTRAL_IMAGE: ghcr.io/${{ github.repository }}/central
  PROBE_IMAGE: ghcr.io/${{ github.repository }}/probe

jobs:
  build-central:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.central
          push: true
          tags: |
            ${{ env.CENTRAL_IMAGE }}:latest
            ${{ env.CENTRAL_IMAGE }}:${{ github.sha }}
          build-args: |
            CACHEBUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cloudflare cache purge is intentionally NOT here.
      # Purge AFTER your deployment panel has pulled the new image.
      # Run the purge-cache workflow manually once the container is live.

  build-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.probe
          push: true
          tags: |
            ${{ env.PROBE_IMAGE }}:latest
            ${{ env.PROBE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
