apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: sentinel
    user: sentinel
    secureJsonData:
      password: ${DB_PASSWORD:-sentinel_secret}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 600
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false
