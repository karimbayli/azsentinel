# ============================================================
# Sentinel V2 — Central Stack (TimescaleDB + App + Grafana + Caddy)
# Deploy on: Hetzner via Coolify
# ============================================================

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sentinel}
      POSTGRES_USER: ${DB_USER:-sentinel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentinel_secret}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-sentinel}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - sentinel

  central:
    build:
      context: ..
      dockerfile: Dockerfile.central
    container_name: sentinel-central
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      SENTINEL_DB_HOST: timescaledb
      SENTINEL_DB_PORT: "5432"
      SENTINEL_DB_USER: ${DB_USER:-sentinel}
      SENTINEL_DB_PASSWORD: ${DB_PASSWORD:-sentinel_secret}
      SENTINEL_DB_NAME: ${DB_NAME:-sentinel}
      SENTINEL_HMAC_SECRET: ${HMAC_SECRET:-change-me-in-production}
      SENTINEL_CALIBRATION: ${CALIBRATION:-true}
      SENTINEL_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SENTINEL_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
    ports:
      - "8080:8080"
    volumes:
      - ../configs/central.yaml:/app/configs/central.yaml:ro
      - ../static:/app/static:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - sentinel

  grafana:
    image: grafana/grafana:10.4.1
    container_name: sentinel-grafana
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-sentinel_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN:-updown.az}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - sentinel

  caddy:
    image: caddy:2-alpine
    container_name: sentinel-caddy
    restart: unless-stopped
    depends_on:
      - central
      - grafana
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-updown.az}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sentinel

volumes:
  timescaledb_data:
  grafana_data:
  caddy_data:
  caddy_config:


networks:
  sentinel:
    driver: bridge
